plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'net.sixik'
version = '1.20.1-2.0.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets { gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            args '--mixin.config', 'bossscalingsystem.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }
        server { workingDirectory project.file('run'); args '--nogui'; mods { bossscalingsystem { source sourceSets.main } } }
        gameTestServer { workingDirectory project.file('run-gametest'); property 'forge.enabledGameTestNamespaces', 'bossscalingsystem'; mods { bossscalingsystem { source sourceSets.main; source sourceSets.gameTest } } }
    }
}
repositories { mavenCentral(); if (providers.gradleProperty('localMods').isPresent()) { flatDir { dirs providers.gradleProperty('localMods').get() } } else { maven { url = 'https://maven.latvian.dev/releases' }; maven { url = 'https://maven.architectury.dev' } } }
def localMods = providers.gradleProperty('localMods').orNull
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.4'
    if (localMods != null) {
        implementation fg.deobf('local:kubejs:forge-2001.6.5-build.16')
        implementation fg.deobf('local:rhino:forge-2001.2.3-build.10')
        implementation fg.deobf('local:architectury:9.2.14-forge')
    } else {
        implementation fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.16')
        implementation fg.deobf('dev.latvian.mods:rhino-forge:2001.2.3-build.10')
        implementation fg.deobf('dev.architectury:architectury-forge:9.2.14')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes 'MixinConfigs': 'bossscalingsystem.mixins.json' }; finalizedBy 'reobfJar' }
def refmapFile = layout.buildDirectory.file('generated/bossscalingsystem.refmap.json')
tasks.named('processResources') { dependsOn 'compileJava'; from(refmapFile) }
tasks.register('mixinSrg') {
    dependsOn 'createMcpToSrg'
    def inputFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg')
    def outputFile = layout.buildDirectory.file('mixinMappings/mcp-to-srg.srg')
    inputs.file(inputFile); outputs.file(outputFile)
    doLast {
        def owner = null
        def lines = []
        inputFile.get().asFile.eachLine { line ->
            if (line.startsWith('tsrg2 ') || line.startsWith('\t\t')) return
            def parts = line.trim().split(' ')
            if (!line.startsWith('\t')) {
                owner = parts[0]; lines.add("CL: ${parts[0]} ${parts[1]}")
            } else if (parts.length == 3 && parts[1].startsWith('(')) {
                lines.add("MD: ${owner}/${parts[0]} ${parts[1]} ${owner}/${parts[2]} ${parts[1]}")
            } else if (parts.length >= 2) { lines.add("FD: ${owner}/${parts[0]} ${owner}/${parts[-1]}") }
        }
        outputFile.get().asFile.parentFile.mkdirs()
        outputFile.get().asFile.text = lines.join('\n') + '\n'
    }
}
tasks.named('compileJava', JavaCompile) {
    dependsOn 'mixinSrg'
    doFirst { refmapFile.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += "-AoutRefMapFile=${refmapFile.get().asFile}"
    options.compilerArgs += "-AreobfSrgFile=${layout.buildDirectory.file('mixinMappings/mcp-to-srg.srg').get().asFile}"
}
tasks.configureEach { task ->
    if (task.name == 'runGameTestServer') {
        doFirst { copy { from 'examples/boss_scaling.js'; into 'run-gametest/kubejs/server_scripts' } }
    }
}

tasks.named('processResources') { from('LICENSE'); from('COPYING'); from('NOTICE') }
